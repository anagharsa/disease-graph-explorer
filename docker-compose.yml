services:
  neo4j:
    image: neo4j:5.26-community
    container_name: disease-graph-explorer-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the project .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the project .env} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  neo4j_data:
  neo4j_logs:
